name: Bug report
description: Something doesn't work, freezes or crashes (English or Spanish)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please **never attach game files**: no `default.xbe`, no `data` folder, no disc image, and not the `.nro` you built (it holds code made from the game). Reports with game files are deleted.
        Check the [troubleshooting table](https://github.com/SantiBros/SpiderMan2-2004-NX/blob/main/docs/INSTALL.md#troubleshooting) first ([en español](https://github.com/SantiBros/SpiderMan2-2004-NX/blob/main/docs/INSTALL.es.md#solución-de-problemas)).
  - type: input
    id: version
    attributes:
      label: Port version
      description: Shown on the start screen, in the Homebrew Menu and on the first line of the log.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Console, firmware and Atmosphère version
      placeholder: "Switch Lite, firmware 22.5.0, Atmosphère 1.10.0"
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Your game is
      options:
        - The disc's files (default.xbe and data)
        - An .iso or .xiso (XISO)
        - An .iso (full disc dump)
        - A .cci
        - A .cso
        - A split image (name.1.iso, name.2.iso, ...)
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where did it go wrong?
      options:
        - Building the .nro on the computer
        - On the Switch, before the game's first picture (the blue start screen)
        - On the Switch, during the game
    validations:
      required: true
  - type: dropdown
    id: launch
    attributes:
      label: Started from
      options:
        - Homebrew Menu, R + a game (title takeover)
        - A forwarder
        - Sphaira or another launcher
        - Homebrew Menu from the Album
        - Not started (the build failed)
    validations:
      required: true
  - type: dropdown
    id: controller
    attributes:
      label: Played with
      options:
        - The console's own controls (Switch Lite, or Joy-Con attached)
        - Joy-Con detached (in the grip or in each hand)
        - A Pro Controller
        - Another controller
  - type: input
    id: settings
    attributes:
      label: Debug menu settings
      description: If you changed any in the debug menu (ZL + ZR + −), which ones (or paste `settings.ini`). The frame-rate counter's number helps too.
      placeholder: "720p, 16:9 full screen, vibration High, GPU clock 768 MHz, counter on: about 25 FPS on the first rooftop"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Did HOME or + and − still work? A photo of the screen helps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach the zipped `switch/SpiderMan2Xbox/logs` folder (with `crash.txt` if there is one), or for a build problem the `build-*.log` file the builder named. For a freeze or an Atmosphère error, also the newest file in `atmosphere/crash_reports/`.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I use my own copy of the game, and I didn't attach any game files or the .nro.
          required: true
